upstream radar_bds_app {
    server 127.0.0.1:5000;
    keepalive 16;
}

server {
    listen 80;
    server_name radar.example.com;

    client_max_body_size 25m;

    access_log /var/log/nginx/radar-bds.access.log;
    error_log /var/log/nginx/radar-bds.error.log;

    location /static/ {
        alias /opt/radar-bds/current/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://radar_bds_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
