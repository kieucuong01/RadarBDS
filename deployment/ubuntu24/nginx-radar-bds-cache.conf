proxy_cache_path /var/cache/nginx/radar-bds levels=1:2 keys_zone=radar_public:32m max_size=512m inactive=24h use_temp_path=off;

map $http_cookie $radar_has_session {
    default 0;
    "~*(^|;\s*)radar_session=" 1;
}

map $upstream_http_x_radar_public_cache $radar_app_public {
    default 0;
    "1" 1;
}

map $radar_app_public $radar_not_app_public {
    default 1;
    1 0;
}
