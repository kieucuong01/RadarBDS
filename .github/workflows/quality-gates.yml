name: Quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: radar_bds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d radar_bds_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PYTHONUTF8: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/radar_bds_test
      RADAR_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/radar_bds_test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt --progress-spinner off

      - name: Scan tracked files for secrets
        run: python scripts/check_tracked_secrets.py

      - name: Compile critical Python modules
        run: python -m py_compile app.py radar.py db/connection.py db/schema.py services/admin_growth.py

      - name: Guard the isolated test database
        run: python -c "from urllib.parse import urlparse; import os; assert 'test' in urlparse(os.environ['DATABASE_URL']).path.lower(), 'CI database name must contain test'"

      - name: Initialize the test schema
        run: python -c "from db.schema import init_schema; init_schema()"

      - name: Run Python tests
        run: python -m pytest tests --ignore=tests/test_guland.py --ignore=tests/sanity_test.py

      - name: Run JavaScript tests
        run: node --test tests/js/*.cjs tests/js/test_*.js
