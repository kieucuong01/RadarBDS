name: Radar Maps warm cache capacity

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type radarbds.vn to run bounded public warm-cache checks
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: radar-maps-production-load
  cancel-in-progress: false

jobs:
  warm-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify production confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = radarbds.vn
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install verified official k6
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/k6.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            https://github.com/grafana/k6/releases/download/v2.1.0/k6-v2.1.0-linux-amd64.tar.gz
          echo "295d961ebfca306f295f1133068dcd403a8171c87f387928f5f30b0fbcff858a  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
      - name: Gate 25 then 100 then 250 then 1000 warm sessions
        run: |
          set -Eeuo pipefail
          mkdir -p maps-results
          for vus in 25 100 250 1000; do
            VUS="$vus" DURATION=30s CONFIRM=radarbds.vn SUMMARY_FILE="maps-results/$vus.json" \
              "$RUNNER_TEMP/k6-v2.1.0-linux-amd64/k6" run --quiet scripts/load/radar_maps_cache_load.js
          done
      - name: Preserve passed and failed gate measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maps-warm-cache-results
          path: maps-results/
          if-no-files-found: ignore
