<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Minh họa cách đọc giá đất Phú Tân theo dữ liệu Radar BDS</title>
  <desc id="desc">Sơ đồ đi từ dữ liệu 708 tin active, tách loại hình bất động sản, so giá trung vị và lọc tín hiệu trên dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ecfdf5"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1200" height="640" rx="36" fill="url(#bg)"/>
  <circle cx="1010" cy="100" r="160" fill="#14b8a6" opacity="0.10"/>
  <circle cx="130" cy="560" r="180" fill="#0ea5e9" opacity="0.10"/>
  <text x="70" y="82" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#0f241c">Đọc giá Phú Tân: không gom mọi loại hình vào một giá chung</text>
  <text x="70" y="122" font-family="Arial, sans-serif" font-size="18" fill="#475569">Nguồn: Radar BDS · Facebook active · cập nhật đến 19/07/2026</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" width="245" height="300" rx="24" fill="url(#card)"/>
    <text x="100" y="220" font-family="Arial" font-size="18" font-weight="700" fill="#0f766e">1 · Dữ liệu đầu vào</text>
    <text x="100" y="285" font-family="Arial" font-size="54" font-weight="900" fill="#10211b">708</text>
    <text x="100" y="318" font-family="Arial" font-size="20" fill="#334155">tin active Phú Tân</text>
    <text x="100" y="370" font-family="Arial" font-size="46" font-weight="900" fill="#0f766e">321</text>
    <text x="100" y="402" font-family="Arial" font-size="18" fill="#334155">tín hiệu hot/giảm giá</text>
  </g>

  <path d="M330 320 C375 320, 390 320, 435 320" stroke="#0f766e" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M420 300 L450 320 L420 340" fill="none" stroke="#0f766e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="465" y="170" width="300" height="300" rx="24" fill="url(#card)"/>
    <text x="495" y="220" font-family="Arial" font-size="18" font-weight="700" fill="#0f766e">2 · Tách loại hình</text>
    <text x="495" y="278" font-family="Arial" font-size="28" font-weight="900" fill="#10211b">Đất nền</text>
    <text x="650" y="278" font-family="Arial" font-size="28" font-weight="900" fill="#0f766e">23,8 tr/m²</text>
    <rect x="495" y="300" width="225" height="16" rx="8" fill="#14b8a6" opacity="0.85"/>
    <text x="495" y="348" font-family="Arial" font-size="28" font-weight="900" fill="#10211b">Nhà đất</text>
    <text x="650" y="348" font-family="Arial" font-size="28" font-weight="900" fill="#0284c7">34,8 tr/m²</text>
    <rect x="495" y="370" width="270" height="16" rx="8" fill="#0284c7" opacity="0.85"/>
    <text x="495" y="420" font-family="Arial" font-size="17" fill="#475569">Giá luôn đi kèm loại tài sản để tránh so sai.</text>
  </g>

  <path d="M782 320 C827 320, 842 320, 887 320" stroke="#0f766e" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M872 300 L902 320 L872 340" fill="none" stroke="#0f766e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="910" y="170" width="220" height="300" rx="24" fill="url(#card)"/>
    <text x="940" y="220" font-family="Arial" font-size="18" font-weight="700" fill="#0f766e">3 · Lọc tiếp</text>
    <circle cx="1020" cy="305" r="62" fill="#0f766e" opacity="0.12"/>
    <path d="M980 306 l28 28 l56 -70" fill="none" stroke="#0f766e" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="960" y="410" font-family="Arial" font-size="20" font-weight="800" fill="#10211b">Mở dashboard</text>
    <text x="940" y="442" font-family="Arial" font-size="16" fill="#475569">lọc phường, loại hình,</text>
    <text x="940" y="466" font-family="Arial" font-size="16" fill="#475569">ngân sách và tín hiệu.</text>
  </g>

  <text x="70" y="560" font-family="Arial" font-size="17" fill="#475569">Radar BDS là bộ lọc dữ liệu ban đầu, không thay thế thẩm định pháp lý, quy hoạch hoặc kiểm tra thực địa.</text>
</svg>