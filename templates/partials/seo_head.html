<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site_meta.title }}</title>
<meta name="description" content="{{ site_meta.description }}">
<meta name="keywords" content="{{ site_meta.keywords }}">
<link rel="canonical" href="{{ site_meta.canonical_url }}">
{% set is_article_page = page is defined and page.get('article') %}
{% set is_report_page = page is defined and page.get('variant') == 'report' and page.get('report') %}
<meta property="og:type" content="{{ 'article' if is_article_page or is_report_page else 'website' }}">
{% if is_article_page %}
<meta property="article:published_time" content="{{ page.article.published_at }}">
<meta property="article:modified_time" content="{{ page.article.modified_at }}">
{% elif is_report_page %}
<meta property="article:published_time" content="{{ page.report.published_at }}">
<meta property="article:modified_time" content="{{ page.report.published_at }}">
{% endif %}
<meta property="og:title" content="{{ site_meta.title }}">
<meta property="og:description" content="{{ site_meta.description }}">
<meta property="og:url" content="{{ site_meta.og_url }}">
<meta property="og:image" content="{{ site_meta.og_image }}">
<meta name="twitter:card" content="summary_large_image">
{% if google_search_console_verification %}<meta name="google-site-verification" content="{{ google_search_console_verification }}">{% endif %}
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon-32.png') }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='images/favicon-16.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
<link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}?v=app-icon-20260608">
<link rel="stylesheet" href="{{ url_for('static', filename='css/seo.css') }}?v=news-hub-20260728-3">
