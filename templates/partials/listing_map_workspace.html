<section id="listingMapWorkspace" class="listing-map-workspace" hidden
  role="dialog" aria-modal="false" aria-labelledby="listingMapTitle">
  <header class="listing-map-workspace-head">
    <div class="listing-map-head-main">
      <h2 id="listingMapTitle">
        Radar BĐS Maps
        <span class="listing-map-title-detail">· Xem lô đất trên bản đồ</span>
      </h2>
      <div class="listing-map-precision-legend" aria-label="Chú giải độ chính xác vị trí">
        <span class="listing-map-precision-exact">Chính xác</span>
        <span class="listing-map-precision-road">Theo đường</span>
        <span class="listing-map-precision-landmark">Theo khu vực</span>
        <span class="listing-map-precision-ward">Theo phường</span>
      </div>
    </div>
    <div class="listing-map-area-control">
      <button id="listingMapLocateArea" class="listing-map-locate-area" type="button"
        aria-label="Chọn khu vực theo vị trí của tôi" aria-busy="false"
        title="Chọn khu vực theo vị trí của tôi" onclick="RadarListingMap.locateArea()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="2.5"></circle>
          <path d="M12 1v4m0 14v4M1 12h4m14 0h4"></path>
        </svg>
      </button>
      <div id="listingMapAreaHost" class="listing-map-area-host" aria-label="Chọn khu vực bản đồ"></div>
    </div>
    <div class="listing-map-head-actions">
      <button id="listingMapFocusButton" type="button"
        class="listing-map-focus-button" aria-pressed="false"
        aria-label="Tập trung bản đồ"
        onclick="RadarListingMap.toggleFocusMode()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"></path>
        </svg>
        <span id="listingMapFocusLabel">Toàn màn hình</span>
      </button>
      {% if USER_TIER == 'admin' %}
      <button id="listingMapEditModeToggle" type="button"
        class="listing-map-edit-toggle" aria-pressed="false"
        aria-label="Bật chế độ sửa định vị"
        onclick="RadarListingMap.toggleAdminEditMode()">
        Sửa định vị
      </button>
      {% endif %}
      <button id="listingMapClose" type="button" class="listing-map-close"
        aria-label="Đóng bản đồ" onclick="RadarListingMap.close()">×</button>
    </div>
  </header>
  <div id="listingMapStatus" class="listing-map-status" role="status"
    aria-live="polite" aria-busy="false"></div>
  <div class="listing-map-workspace-body">
    <div id="listingMapCanvas" class="listing-map-canvas"
      aria-label="Bản đồ các lô đất">
      <div id="listingMapFilterSummary" class="listing-map-filter-summary"
        aria-label="Bộ lọc đang áp dụng"></div>
    </div>
    <aside id="listingMapPanel" class="listing-map-panel"
      aria-label="Deal mới nhất và danh sách theo vị trí"></aside>
  </div>
  <div id="listingMapMobileSheet" class="listing-map-mobile-sheet"
    data-state="collapsed"
    aria-label="Deal mới nhất và danh sách theo vị trí trên thiết bị di động"></div>
</section>
