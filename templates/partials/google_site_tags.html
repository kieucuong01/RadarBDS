{% if GOOGLE_SEARCH_CONSOLE_VERIFICATION %}
<meta name="google-site-verification" content="{{ GOOGLE_SEARCH_CONSOLE_VERIFICATION }}">
{% endif %}
{% if GOOGLE_ANALYTICS_ID %}
<script>
  window.dataLayer = window.dataLayer || [];
  window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
  (function () {
    const analyticsId = {{ GOOGLE_ANALYTICS_ID | tojson }};
    let analyticsLoaded = false;

    function loadRadarAnalytics() {
      if (analyticsLoaded || !analyticsId) return;
      analyticsLoaded = true;
      let script = document.querySelector('script[data-radar-analytics]');
      if (!script) {
        script = document.createElement("script");
        script.async = true;
        script.dataset.radarAnalytics = analyticsId;
        script.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(analyticsId);
        document.head.appendChild(script);
      }
      if (window.RadarAnalyticsConfiguredId !== analyticsId) {
        window.gtag("js", new Date());
        window.gtag("config", analyticsId);
        window.RadarAnalyticsConfiguredId = analyticsId;
      }
    }

    window.RadarLoadAnalytics = loadRadarAnalytics;
    ["pointerdown", "keydown", "touchstart", "scroll"].forEach((eventName) => {
      window.addEventListener(eventName, loadRadarAnalytics, { once: true, passive: true });
    });
    window.addEventListener("radar:first-signals-rendered", () => {
      setTimeout(loadRadarAnalytics, 8000);
    }, { once: true });
    window.setTimeout(loadRadarAnalytics, 1800);
  })();
</script>
{% endif %}
