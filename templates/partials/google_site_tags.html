{% if GOOGLE_SEARCH_CONSOLE_VERIFICATION %}
<meta name="google-site-verification" content="{{ GOOGLE_SEARCH_CONSOLE_VERIFICATION }}">
{% endif %}
{% if GOOGLE_ANALYTICS_ID %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ GOOGLE_ANALYTICS_ID | urlencode }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag("js", new Date());
  gtag("config", {{ GOOGLE_ANALYTICS_ID | tojson }});
</script>
{% endif %}
