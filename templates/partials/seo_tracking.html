<script>
(() => {
  const analyticsId = {{ google_analytics_id|default('', true)|tojson }};
  const viewEvent = {{ view_event|default('seo_landing_viewed')|tojson }};
  const pageMeta = {
    path: window.location.pathname,
    page_slug: window.location.pathname.replace(/^\/+|\/+$/g, ""),
    page_title: document.title
  };

  window.dataLayer = window.dataLayer || [];
  window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };

  function sendRadarEvent(action, context) {
    const payload = Object.assign({}, pageMeta, context || {});
    try {
      fetch('/api/track', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ action: action, context: payload }),
        keepalive: true
      }).catch(function () {});
    } catch (err) {}
    try {
      window.gtag("event", action, payload);
    } catch (err) {}
  }

  if (analyticsId) {
    window.gtag("js", new Date());
    window.gtag("config", analyticsId);
    const loadAnalytics = () => {
      if (document.querySelector('script[data-radar-analytics]')) return;
      const script = document.createElement("script");
      script.async = true;
      script.dataset.radarAnalytics = "true";
      script.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(analyticsId);
      document.head.appendChild(script);
    };
    window.addEventListener("load", () => window.setTimeout(loadAnalytics, 1200), { once: true });
  }

  const params = new URLSearchParams(window.location.search);
  const utmSource = (params.get('utm_source') || '').trim().toLowerCase();
  const utmMedium = (params.get('utm_medium') || '').trim().toLowerCase();
  const utmCampaign = (params.get('utm_campaign') || '').trim().slice(0, 80);
  const utmContent = (params.get('utm_content') || '').trim().slice(0, 80);
  const utmTerm = (params.get('utm_term') || '').trim().slice(0, 80);
  const socialSources = ['facebook', 'fb', 'instagram', 'linkedin', 'tiktok', 'twitter', 'x'];
  const socialMediums = [
    'social', 'organic_social', 'social_organic', 'paid_social',
    'pinned_comment', 'group_post', 'comment'
  ];
  const aiUtmSources = {
    'chatgpt': 'chatgpt',
    'chatgpt.com': 'chatgpt',
    'openai': 'chatgpt',
    'chat.openai.com': 'chatgpt',
    'openai.com': 'chatgpt',
    'gemini': 'gemini',
    'gemini.google.com': 'gemini',
    'perplexity': 'perplexity',
    'perplexity.ai': 'perplexity',
    'copilot': 'copilot',
    'copilot.microsoft.com': 'copilot'
  };
  let referrerHost = '';
  try {
    referrerHost = new URL(document.referrer).hostname.toLowerCase().replace(/^www\./, '');
  } catch (err) {}
  let referrerAiSource = '';
  if (referrerHost === 'chatgpt.com' || referrerHost.endsWith('.chatgpt.com') ||
      referrerHost === 'chat.openai.com' || referrerHost.endsWith('.openai.com')) {
    referrerAiSource = 'chatgpt';
  } else if (referrerHost === 'gemini.google.com') {
    referrerAiSource = 'gemini';
  } else if (referrerHost === 'perplexity.ai' || referrerHost.endsWith('.perplexity.ai')) {
    referrerAiSource = 'perplexity';
  } else if (referrerHost === 'copilot.microsoft.com') {
    referrerAiSource = 'copilot';
  }
  const aiSource = aiUtmSources[utmSource] || referrerAiSource;
  const isSocial = socialSources.indexOf(utmSource) !== -1 ||
    socialMediums.indexOf(utmMedium) !== -1;
  const searchHosts = ['google.com', 'bing.com', 'duckduckgo.com', 'coccoc.com'];
  const isSearchReferrer = searchHosts.some((host) => (
    referrerHost === host || referrerHost.endsWith('.' + host)
  ));
  let acquisitionChannel = 'direct_unknown';
  if (aiSource) {
    acquisitionChannel = 'ai';
  } else if (isSocial) {
    acquisitionChannel = 'social';
  } else if (utmMedium === 'organic' || isSearchReferrer) {
    acquisitionChannel = 'organic';
  }
  const acquisitionContext = {
    channel: acquisitionChannel,
    utm_source: utmSource.slice(0, 80),
    utm_medium: utmMedium.slice(0, 80),
    utm_campaign: utmCampaign,
    utm_content: utmContent,
    utm_term: utmTerm
  };
  if (aiSource) acquisitionContext.ai_source = aiSource;
  if (referrerAiSource) acquisitionContext.referrer_host = referrerHost;

  if (isSocial) {
    sendRadarEvent('social_utm_visit', {
      utm_source: utmSource,
      utm_medium: utmMedium,
      utm_campaign: utmCampaign,
      utm_content: utmContent,
      utm_term: utmTerm
    });
  }
  if (aiSource) {
    sendRadarEvent('ai_referral_visit', {
      ai_source: aiSource,
      referrer_host: referrerAiSource ? referrerHost : '',
      path: pageMeta.path,
      page_slug: pageMeta.page_slug
    });
  }

  sendRadarEvent(viewEvent, Object.assign({}, acquisitionContext));

  window.addEventListener("radar:track", (event) => {
    const detail = event.detail || {};
    if (!detail.action) return;
    sendRadarEvent(detail.action, detail.context || {});
  });

  document.addEventListener("click", (event) => {
    const publicContentTarget = event.target.closest("[data-public-content-action]");
    if (publicContentTarget) {
      sendRadarEvent("public_content_card_clicked", {
        kind: publicContentTarget.dataset.contentKind || "unknown",
        slug: publicContentTarget.dataset.contentSlug || "",
        target: publicContentTarget.getAttribute("href") || "",
        source_surface: publicContentTarget.dataset.publicContentAction || "card"
      });
    }
    const documentTarget = event.target.closest("[data-public-document-action]");
    if (documentTarget) {
      sendRadarEvent("public_document_download_clicked", {
        slug: documentTarget.dataset.documentSlug || "",
        target: documentTarget.getAttribute("href") || ""
      });
    }
    const reportTarget = event.target.closest("[data-report-action]");
    if (reportTarget) {
      const actionMap = {
        open: "report_open",
        dashboard: "report_dashboard_click",
        listing: "report_listing_click"
      };
      const reportAction = actionMap[reportTarget.dataset.reportAction];
      if (reportAction) {
        sendRadarEvent(reportAction, {
          city: reportTarget.dataset.reportCity || "unknown",
          ward_slug: reportTarget.dataset.reportWard || "all",
          period: reportTarget.dataset.reportPeriod || "unknown",
          source_surface: reportTarget.dataset.reportSurface || "unknown",
          listing_id: reportTarget.dataset.listingId || ""
        });
      }
    }
    const link = event.target.closest("[data-track-cta]");
    if (!link) return;
    sendRadarEvent("cta_clicked", {
      cta_name: link.dataset.trackCta || "unknown",
      destination: link.getAttribute("href") || ""
    });
  });
})();
</script>
